<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esperando · GUILLEGIU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #0b0b0e; color: #fff; font-family: Inter, system-ui, sans-serif;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header { text-align: center; padding: 24px 16px 0; }
    .marca { font-family: Anton, sans-serif; letter-spacing: 0.06em; font-size: clamp(22px, 4vw, 40px); color: #e1222b; }
    .volver {
      display: inline-block; margin-bottom: 14px; padding: 10px 20px; border-radius: 999px;
      background: #e1222b; color: #fff; font-weight: 700; text-decoration: none;
      box-shadow: 0 6px 20px rgba(225, 34, 43, 0.4); position: relative; z-index: 6;
    }
    .sub { color: #9a9aa5; text-transform: uppercase; letter-spacing: 0.2em; font-size: 12px; margin-top: 4px; }
    .cuenta { text-align: center; padding: 10px 16px; }
    .cuenta .t { color: #9a9aa5; text-transform: uppercase; letter-spacing: 0.18em; font-size: 13px; }
    .reloj {
      font-family: Anton, sans-serif; font-size: clamp(56px, 14vw, 160px); line-height: 1;
      margin-top: 6px; text-shadow: 0 0 30px rgba(225, 34, 43, 0.55); font-variant-numeric: tabular-nums;
    }
    .reloj small { font-size: 0.32em; color: #9a9aa5; margin: 0 0.15em 0 0.05em; }

    .tarima-zona {
      position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end;
      background: radial-gradient(ellipse at 50% 0%, rgba(225, 34, 43, 0.28), transparent 60%),
        radial-gradient(ellipse at 20% 10%, rgba(91, 141, 239, 0.22), transparent 50%),
        radial-gradient(ellipse at 80% 10%, rgba(255, 211, 77, 0.18), transparent 50%);
      overflow: hidden;
    }
    .luces { position: absolute; inset: 0; pointer-events: none; }
    .luces span {
      position: absolute; top: -10%; width: 22%; height: 120%; transform-origin: 50% 0;
      clip-path: polygon(45% 0, 55% 0, 100% 100%, 0 100%);
      animation: reflector 4s ease-in-out infinite alternate;
    }
    .luces span:nth-child(1) { left: 5%; background: linear-gradient(180deg, rgba(225, 34, 43, 0.4), transparent 80%); }
    .luces span:nth-child(2) { left: 30%; animation-delay: -1s; background: linear-gradient(180deg, rgba(91, 141, 239, 0.35), transparent 80%); }
    .luces span:nth-child(3) { left: 55%; animation-delay: -2s; background: linear-gradient(180deg, rgba(255, 211, 77, 0.3), transparent 80%); }
    .luces span:nth-child(4) { left: 78%; animation-delay: -3s; background: linear-gradient(180deg, rgba(63, 209, 165, 0.3), transparent 80%); }
    @keyframes reflector { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }

    .bailarines { position: relative; z-index: 2; margin: 0 2%; }
    /* Cada mascota camina a los saltos de un lado a otro (left lo mueve el JS). */
    .bailarin {
      position: absolute; bottom: 0; display: flex; flex-direction: column; align-items: center;
      transform: translateX(-50%); transition-property: left; transition-timing-function: ease-in-out;
    }
    .bailarin .flip { transition: transform 0.25s; }
    .bailarin.izq .flip { transform: scaleX(-1); }
    .bailarin.camina svg { animation-name: baile-salto !important; animation-duration: 0.55s !important; }
    .bailarin svg {
      display: block; animation-duration: 0.9s; animation-iteration-count: infinite;
      animation-timing-function: ease-in-out; animation-delay: inherit; transform-origin: 50% 100%;
    }
    .baile-salto svg { animation-name: baile-salto; }
    .baile-vaiven svg { animation-name: baile-vaiven; animation-duration: 1.1s; }
    .baile-giro svg { animation-name: baile-giro; animation-duration: 1.6s; }
    .baile-lado svg { animation-name: baile-lado; animation-duration: 1.2s; }
    @keyframes baile-salto {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      15% { transform: translateY(0) scale(1.08, 0.9); }
      45% { transform: translateY(-22%) scale(0.95, 1.06); }
    }
    @keyframes baile-vaiven { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg) translateY(-6%); } }
    @keyframes baile-giro {
      0% { transform: scaleX(1); } 25% { transform: scaleX(-1) translateY(-8%); }
      50% { transform: scaleX(-1); } 75% { transform: scaleX(1) translateY(-8%); }
    }
    @keyframes baile-lado { 0%, 100% { transform: translateX(-10%) rotate(-6deg); } 50% { transform: translateX(10%) rotate(6deg) translateY(-5%); } }
    .nombre { white-space: nowrap; font-weight: 700; font-size: 14px; text-align: center; text-shadow: 0 2px 6px #000; }
    .vacio { color: #9a9aa5; padding: 30px; text-align: center; }

    .tarima {
      position: relative; height: 34px; margin: -6px -4px 0; border-radius: 10px 10px 4px 4px;
      background: linear-gradient(180deg, #b0784a 0 30%, #8a5a35 30% 100%);
      box-shadow: 0 10px 0 #5c3b23, 0 18px 30px rgba(0, 0, 0, 0.4); z-index: 1;
    }
    .tarima::before {
      content: ''; position: absolute; inset: 12px 10px 6px;
      background: repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.08) 0 40px, transparent 40px 80px);
    }
    footer { height: 20px; }

    /* Escenario chico con el conejo cantante, al fondo y al centro. */
    .escenario {
      position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); z-index: 1;
      display: flex; flex-direction: column; align-items: center; pointer-events: none;
    }
    .conejo {
      width: clamp(96px, 13vw, 150px); height: auto; display: block; margin-bottom: -4px;
      transform-origin: 50% 100%; animation: canta 0.92s ease-in-out infinite;
    }
    .conejo .boca { transform-origin: 60px 93px; animation: boca 0.46s ease-in-out infinite; }
    .conejo .orejas { transform-origin: 60px 52px; animation: orejas 0.92s ease-in-out infinite; }
    @keyframes canta { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-3%); } }
    @keyframes boca { 0%, 100% { transform: scaleY(0.4); } 50% { transform: scaleY(1.2); } }
    @keyframes orejas { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    .escenario-base {
      width: clamp(120px, 20vw, 230px); height: clamp(90px, 16vh, 150px); border-radius: 6px 6px 2px 2px;
      background: linear-gradient(180deg, #e1222b 0 14px, #8f1218 14px),
        repeating-linear-gradient(0deg, transparent 0 18px, rgba(0, 0, 0, 0.25) 18px 20px);
      background-blend-mode: multiply;
      box-shadow: 0 6px 0 #4d0a0d, 0 0 40px rgba(225, 34, 43, 0.45);
    }
    .escenario::before {
      content: ''; position: absolute; left: 50%; top: -30%; width: 160%; height: 150%; transform: translateX(-50%);
      background: radial-gradient(ellipse at 50% 70%, rgba(255, 240, 200, 0.22), transparent 60%); z-index: -1;
    }

    /* Parlantes a los costados de la tarima; laten cuando suena la música. */
    .parlante {
      position: absolute; bottom: 28px; z-index: 1; width: clamp(54px, 9vw, 110px); aspect-ratio: 0.62;
      background: linear-gradient(160deg, #2a2a31, #121216); border: 3px solid #050506; border-radius: 10px;
      box-shadow: inset 0 0 0 3px #222228, 0 10px 24px rgba(0, 0, 0, 0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 8% 0;
    }
    .parlante.izq { left: 2%; }
    .parlante.der { right: 2%; }
    .cono {
      display: block; width: 74%; aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle, #555 0 14%, #111 16% 34%, #2b2b30 36% 62%, #0a0a0c 64%);
      box-shadow: 0 0 0 3px #3a3a42;
    }
    .cono.chico { width: 40%; }
    .sonando .cono { animation: latido 0.46s ease-in-out infinite; }
    .sonando .cono.chico { animation-duration: 0.23s; }
    .sonando .parlante { box-shadow: inset 0 0 0 3px #222228, 0 0 30px rgba(225, 34, 43, 0.45); }
    @keyframes latido { 0%, 100% { transform: scale(1); } 30% { transform: scale(1.1); } }
    .notas { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
    .nota {
      position: absolute; bottom: 30%; font-size: clamp(18px, 3vw, 30px); color: #fff; opacity: 0;
      text-shadow: 0 0 10px rgba(225, 34, 43, 0.9); animation: nota 2.6s ease-out forwards;
    }
    @keyframes nota {
      0% { opacity: 0; transform: translate(0, 0) rotate(0); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--dx), -160px) rotate(var(--rot)); }
    }
    .musica {
      position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); z-index: 5;
      font: inherit; font-weight: 700; color: #fff; background: #e1222b; border: 0; border-radius: 999px;
      padding: 12px 22px; cursor: pointer; box-shadow: 0 6px 20px rgba(225, 34, 43, 0.5);
    }
    .tema { position: fixed; left: 12px; bottom: 6px; z-index: 5; color: #9a9aa5; font-size: 12px; }
    .tema:not(:empty)::before { content: '\266B  '; }
  </style>
</head>
<body>
  <header>
    <a class="volver" href="/">Ver el video y confirmar</a>
    <div class="marca">GUILLEGIU · TEMPORADA 28</div>
    <div class="sub">Sábado 7 de noviembre · Open doors 23:00</div>
  </header>
  <div class="cuenta">
    <div class="t" id="cuenta-t">Faltan</div>
    <div class="reloj" id="reloj">--:--:--</div>
  </div>
  <div class="tarima-zona">
    <div class="luces"><span></span><span></span><span></span><span></span></div>
    <div class="parlante izq"><i class="cono chico"></i><i class="cono"></i></div>
    <div class="parlante der"><i class="cono chico"></i><i class="cono"></i></div>
    <div class="notas" id="notas"></div>
    <div class="escenario">
      <svg class="conejo" viewBox="0 0 120 150" aria-hidden="true">
        <!-- orejas -->
        <g class="orejas">
          <path d="M44 52 C34 22 38 2 48 4 C58 6 58 30 54 52 Z" fill="#f4f1ea" stroke="#2b2233" stroke-width="2.5"/>
          <path d="M47 46 C42 26 44 12 48 12 C53 14 53 30 51 46 Z" fill="#f3b3c2"/>
          <path d="M66 52 C66 26 74 4 84 8 C94 12 84 34 76 54 Z" fill="#f4f1ea" stroke="#2b2233" stroke-width="2.5"/>
          <path d="M70 48 C71 30 76 16 81 16 C86 18 80 34 74 48 Z" fill="#f3b3c2"/>
        </g>
        <!-- cuerpo -->
        <ellipse cx="60" cy="118" rx="26" ry="24" fill="#f4f1ea" stroke="#2b2233" stroke-width="2.5"/>
        <ellipse cx="60" cy="124" rx="13" ry="14" fill="#fff"/>
        <ellipse cx="48" cy="141" rx="9" ry="5" fill="#f4f1ea" stroke="#2b2233" stroke-width="2"/>
        <ellipse cx="72" cy="141" rx="9" ry="5" fill="#f4f1ea" stroke="#2b2233" stroke-width="2"/>
        <!-- cabeza -->
        <ellipse cx="60" cy="74" rx="30" ry="26" fill="#f4f1ea" stroke="#2b2233" stroke-width="2.5"/>
        <!-- anteojos de sol -->
        <g>
          <path d="M33 66 L87 66" stroke="#111" stroke-width="3"/>
          <path d="M34 66 h22 a2 2 0 0 1 2 2 c0 8 -5 13 -12 13 c-7 0 -12 -6 -12 -13 Z" fill="#111"/>
          <path d="M62 66 h22 a2 2 0 0 1 2 2 c0 8 -5 13 -12 13 c-7 0 -12 -6 -12 -13 Z" fill="#111"/>
          <path d="M39 69 l6 0" stroke="#7fd3ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <path d="M67 69 l6 0" stroke="#7fd3ff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        </g>
        <!-- nariz, boca cantando, cachetes -->
        <path d="M57 84 L63 84 L60 88 Z" fill="#e57d95"/>
        <ellipse class="boca" cx="60" cy="93" rx="5" ry="4" fill="#c0465f" stroke="#2b2233" stroke-width="1.5"/>
        <ellipse cx="40" cy="86" rx="5" ry="3" fill="#f08aa3" opacity="0.5"/>
        <ellipse cx="80" cy="86" rx="5" ry="3" fill="#f08aa3" opacity="0.5"/>
        <!-- brazo con microfono -->
        <g class="mic">
          <path d="M80 112 Q92 104 86 96" stroke="#2b2233" stroke-width="10" fill="none" stroke-linecap="round"/>
          <path d="M80 112 Q92 104 86 96" stroke="#f4f1ea" stroke-width="6.5" fill="none" stroke-linecap="round"/>
          <rect x="74" y="88" width="7" height="16" rx="3" transform="rotate(35 77 96)" fill="#333" stroke="#111" stroke-width="1.5"/>
          <circle cx="71" cy="88" r="6.5" fill="#9aa3ad" stroke="#111" stroke-width="1.5"/>
          <path d="M66 87 h10 M67 90 h8" stroke="#555" stroke-width="1"/>
        </g>
      </svg>
      <div class="escenario-base"></div>
    </div>
    <div class="bailarines" id="bailarines"></div>
    <div class="tarima"></div>
  </div>
  <div class="tema" id="tema"></div>
  <div id="yt" style="position:fixed;width:1px;height:1px;left:-10px;bottom:0;opacity:0;pointer-events:none"></div>
  <footer></footer>

  <script src="/mascota.js"></script>
  <script>
    (function () {
      // Sábado 7/11/2026 a las 23:00 hora de Argentina.
      const OBJETIVO = new Date('2026-11-07T23:00:00-03:00').getTime();
      const BAILES = ['baile-salto', 'baile-vaiven', 'baile-giro', 'baile-lado'];
      const reloj = document.getElementById('reloj');
      const pad = (n) => String(n).padStart(2, '0');

      function tick() {
        const ms = OBJETIVO - Date.now();
        if (ms <= 0) {
          document.getElementById('cuenta-t').textContent = 'Arrancó';
          reloj.textContent = 'OPEN DOORS';
          return;
        }
        const s = Math.floor(ms / 1000);
        const d = Math.floor(s / 86400);
        const h = Math.floor((s % 86400) / 3600);
        const m = Math.floor((s % 3600) / 60);
        const ss = s % 60;
        reloj.innerHTML = (d ? `${d}<small>d</small> ` : '') + `${pad(h)}:${pad(m)}:${pad(ss)}`;
      }
      tick();
      setInterval(tick, 1000);

      // Cada tanto elige un punto al azar del escenario y va saltando hasta ahí;
      // al llegar baila un rato en el lugar.
      let timers = [];
      function pasear(d) {
        const quieto = 1500 + Math.random() * 3500;
        timers.push(setTimeout(() => {
          const desde = parseFloat(d.style.left);
          const hasta = 5 + Math.random() * 90;
          const dur = Math.max(1, Math.abs(hasta - desde) / 12);
          d.classList.toggle('izq', hasta < desde);
          d.classList.add('camina');
          d.style.transitionDuration = dur + 's';
          d.style.left = hasta + '%';
          timers.push(setTimeout(() => { d.classList.remove('camina'); pasear(d); }, dur * 1000));
        }, quieto));
      }

      // ---------- música: los temas cargados en mixia, desde YouTube, en bucle y mezclados ----------
      const TEMAS = [
        'Pt0gH4H_NQw','njWsIZK7PGA', 'acEOASYioGY', 'v9T_MGfzq7I', 'eopPKANmKyg',
        'myDIeOjqQos', 'lqX1S9mFHbU', 'yaHf1FwMYA4', 'zAfrPjTvSNs', 'EVgd4gvY0hU', 'qBUKfQRbzuk',
        'X2MGCIDOMZ4', 'kLUeP9E9f5k', 'br9Bz-x0LeQ', 'hitCWMxsMi4', 'QdQEljUMCEM', 'sGJM-BUAl4w',
        'JY-D0D1pC_k', 'jCQ_6XbATPc', 'TmKh7lAwnBI', 'osTJc5e1Cyo',
      ];
      for (let i = TEMAS.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [TEMAS[i], TEMAS[j]] = [TEMAS[j], TEMAS[i]];
      }
      const zona = document.querySelector('.tarima-zona');
      let player = null;
      let notasTimer = null;

      function sonando(si) {
        zona.classList.toggle('sonando', si);
        clearInterval(notasTimer);
        if (si) notasTimer = setInterval(soltarNota, 450);
      }
      function soltarNota() {
        const n = document.createElement('span');
        n.className = 'nota';
        n.textContent = ['♪', '♫', '♬'][Math.floor(Math.random() * 3)];
        const izq = Math.random() < 0.5;
        n.style.left = (izq ? 4 + Math.random() * 8 : 88 + Math.random() * 8) + '%';
        n.style.setProperty('--dx', (izq ? 1 : -1) * (20 + Math.random() * 60) + 'px');
        n.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
        document.getElementById('notas').append(n);
        setTimeout(() => n.remove(), 2700);
      }

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('yt', {
          width: 200, height: 120,
          playerVars: { playsinline: 1, controls: 0 },
          events: {
            // Arranca solo. Si el navegador no deja sonido sin un toque, arranca en silencio
            // y se activa el sonido con el primer toque o tecla en cualquier lado.
            onReady: () => {
              player.setLoop(true);
              player.loadPlaylist(TEMAS);
              player.unMute();
              player.setVolume(100);
              setTimeout(() => {
                if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
                  player.mute();
                  player.playVideo();
                }
              }, 1500);
            },
            onStateChange: (e) => {
              sonando(e.data === YT.PlayerState.PLAYING);
              if (e.data === YT.PlayerState.PLAYING) {
                const d = player.getVideoData();
                document.getElementById('tema').textContent = d && d.title ? d.title : '';
              }
              if (e.data === YT.PlayerState.ENDED) player.playVideoAt(0);
            },
            // Si un tema no se puede embeber, pasa al siguiente.
            onError: () => player.nextVideo(),
          },
        });
      };
      const s = document.createElement('script');
      s.src = 'https://www.youtube.com/iframe_api';
      document.head.append(s);

      function conSonido() {
        if (!player || !player.playVideo) return;
        player.unMute();
        player.setVolume(100);
        player.playVideo();
      }
      for (const ev of ['pointerdown', 'keydown', 'touchstart']) document.addEventListener(ev, conSonido);

      let ultimo = '';
      async function cargar() {
        try {
          const { pets } = await fetch('/api/pets').then((r) => r.json());
          const firma = JSON.stringify(pets);
          if (firma === ultimo) return;
          ultimo = firma;
          const box = document.getElementById('bailarines');
          box.textContent = '';
          timers.forEach(clearTimeout);
          timers = [];
          const tam = pets.length > 24 ? 64 : pets.length > 12 ? 82 : pets.length > 6 ? 104 : 128;
          box.style.height = tam + 26 + 'px';
          pets.forEach((p, i) => {
            const d = document.createElement('div');
            d.className = 'bailarin ' + BAILES[i % BAILES.length];
            d.style.animationDelay = `${-((i * 0.37) % 1.2)}s`;
            d.style.left = (8 + Math.random() * 84) + '%';
            const flip = document.createElement('div');
            flip.className = 'flip';
            flip.innerHTML = Mascota.svg(p.design, tam);
            const n = document.createElement('div');
            n.className = 'nombre';
            n.textContent = p.nombre;
            d.append(flip, n);
            box.append(d);
            pasear(d);
          });
          if (!pets.length) {
            const v = document.createElement('div');
            v.className = 'vacio';
            v.textContent = 'Todavía no hay mascotas en la tarima.';
            box.append(v);
          }
        } catch {}
      }
      cargar();
      setInterval(cargar, 30000);
    })();
  </script>
</body>
</html>
